<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Alyssa Youm, health-tech engineer: Co-founder and CEO of Mosaan Health, AI for point-of-care diagnostics, future bioinformatician">
<defs>
<style>@font-face{font-family:'FrauncesI';src:url(data:font/woff2;base64,) format('woff2');}
.hi{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;fill:#C4B5FD;}
.nm{font-family:'FrauncesI',Georgia,serif;font-size:96px;letter-spacing:-1px;}
.role{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:27px;fill:#EDE9FE;opacity:0;}
.loc{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;fill:#A78BFA;}
@keyframes roles{0%{opacity:0;transform:translateY(8px)}5%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-6px)}}
.r0{animation:roles 9s 0s infinite;}.r1{animation:roles 9s 3s infinite;}.r2{animation:roles 9s 6s infinite;}
.beat{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.5s ease-in-out infinite;}
@keyframes draw{0%{stroke-dashoffset:900}55%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.drift{animation:drift 7s ease-in-out infinite;transform-box:fill-box;}
.d1{animation-duration:9s;animation-direction:reverse} .d2{animation-duration:11s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-7px)}}
.scan{animation:scan 5s ease-in-out infinite;}
@keyframes scan{0%{transform:translateY(-190px)}50%{transform:translateY(190px)}100%{transform:translateY(-190px)}}
.ring{transform-origin:900px 220px;animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.flag{transform-origin:975px 160px;animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.35}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r0{opacity:1} .beat{stroke-dashoffset:0}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0A36"/><stop offset=".55" stop-color="#2E1463"/><stop offset="1" stop-color="#3B1C86"/></linearGradient>
<radialGradient id="glow" cx="900" cy="220" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="field" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EDE9FE"/><stop offset="1" stop-color="#D8CCFF"/></radialGradient>
<linearGradient id="nameG" x1="0" x2="1"><stop offset="0" stop-color="#F5F3FF"/><stop offset=".6" stop-color="#C4B5FD"/><stop offset="1" stop-color="#93A8FF"/></linearGradient>
<linearGradient id="beatG" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED" stop-opacity="0"/><stop offset=".5" stop-color="#7C3AED" stop-opacity=".28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
<clipPath id="lens"><circle cx="900" cy="220" r="160"/></clipPath>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C4B5FD"/></pattern>
</defs>
<rect width="1200" height="440" rx="32" fill="url(#bg)"/>
<rect width="1200" height="440" rx="32" fill="url(#dots)" opacity=".07"/>
<circle cx="900" cy="220" r="260" fill="url(#glow)"/>
<path class="tw" style="animation-delay:0s" transform="translate(640 70) scale(1.1)" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#EDE9FE"/><path class="tw" style="animation-delay:1.1s" transform="translate(1120 70) scale(0.8)" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#EDE9FE"/><path class="tw" style="animation-delay:2s" transform="translate(700 390) scale(0.7)" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#EDE9FE"/><path class="tw" style="animation-delay:0.6s" transform="translate(1135 380) scale(1.2)" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#EDE9FE"/><path class="tw" style="animation-delay:1.6s" transform="translate(90 60) scale(0.6)" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#EDE9FE"/>
<text class="hi" x="72" y="120">hi, I'm</text>
<text class="nm" x="66" y="212" fill="url(#nameG)">Alyssa Youm</text>
<g><text class="role r0" x="72" y="268">Co-founder &amp; CEO @ Mosaan Health</text><text class="role r1" x="72" y="268">AI for point-of-care diagnostics</text><text class="role r2" x="72" y="268">Future bioinformatician</text></g>
<path d="M72 340 H250 l12 -18 l14 34 l16 -48 l16 56 l12 -24 H400 l10 -10 l10 10 H620" fill="none" stroke="#3F2A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="beat" d="M72 340 H250 l12 -18 l14 34 l16 -48 l16 56 l12 -24 H400 l10 -10 l10 10 H620" fill="none" stroke="url(#beatG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="loc" x="72" y="408">Computer Science Engineering @ DAUST, Senegal</text>
<g class="ring"><circle cx="900" cy="220" r="192" fill="none" stroke="#C4B5FD" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 11"/></g>
<circle cx="900" cy="220" r="176" fill="none" stroke="#C4B5FD" stroke-opacity=".3" stroke-width="10"/>
<circle cx="900" cy="220" r="160" fill="url(#field)"/>
<g clip-path="url(#lens)"><g class="drift d0"><ellipse cx="820" cy="150" rx="26" ry="23.4" fill="#C4B5FD" opacity=".95"/><ellipse cx="820" cy="150" rx="11.7" ry="10.4" fill="#A78BFA" opacity=".55"/></g><g class="drift d1"><ellipse cx="905" cy="95" rx="20" ry="18" fill="#A9C4FF" opacity=".95"/><ellipse cx="905" cy="95" rx="9" ry="8" fill="#7C9BFF" opacity=".55"/></g><g class="drift d2"><ellipse cx="975" cy="160" rx="28" ry="25.2" fill="#C4B5FD" opacity=".95"/><ellipse cx="975" cy="160" rx="12.6" ry="11.2" fill="#A78BFA" opacity=".55"/></g><g class="drift d0"><ellipse cx="860" cy="245" rx="24" ry="21.6" fill="#A9C4FF" opacity=".95"/><ellipse cx="860" cy="245" rx="10.8" ry="9.6" fill="#7C9BFF" opacity=".55"/></g><g class="drift d1"><ellipse cx="950" cy="270" rx="30" ry="27" fill="#C4B5FD" opacity=".95"/><ellipse cx="950" cy="270" rx="13.5" ry="12" fill="#A78BFA" opacity=".55"/></g><g class="drift d2"><ellipse cx="1010" cy="235" rx="18" ry="16.2" fill="#A9C4FF" opacity=".95"/><ellipse cx="1010" cy="235" rx="8.1" ry="7.2" fill="#7C9BFF" opacity=".55"/></g><g class="drift d0"><ellipse cx="800" cy="300" rx="20" ry="18" fill="#C4B5FD" opacity=".95"/><ellipse cx="800" cy="300" rx="9" ry="8" fill="#A78BFA" opacity=".55"/></g><g class="drift d1"><ellipse cx="890" cy="345" rx="22" ry="19.8" fill="#C4B5FD" opacity=".95"/><ellipse cx="890" cy="345" rx="9.9" ry="8.8" fill="#A78BFA" opacity=".55"/></g><g class="drift d2"><ellipse cx="1040" cy="320" rx="16" ry="14.4" fill="#A9C4FF" opacity=".95"/><ellipse cx="1040" cy="320" rx="7.2" ry="6.4" fill="#7C9BFF" opacity=".55"/></g>
<circle class="flag" cx="975" cy="160" r="40" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 6"/>
<rect class="scan" x="740" y="190" width="320" height="60" fill="url(#scanG)"/></g>
<circle cx="900" cy="220" r="160" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2"/>
<path d="M800 120 A140 140 0 0 1 880 82" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
</svg>
